name: Deploy site and SDK

# Publishes the marketing site and the SDK files to GitHub Pages:
#   https://<owner>.github.io/splitly/          marketing site
#   https://<owner>.github.io/splitly/sdk/v1.js SDK (+ splitly-qa.iife.js next to it)
# Enable it once in Settings › Pages › Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/sdk
      - run: npm run size -w packages/sdk
      - run: npm run build -w apps/web
        env:
          WEB_BASE: /${{ github.event.repository.name }}/
          VITE_DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      - name: Add the SDK files
        run: |
          mkdir -p apps/web/dist/sdk
          cp packages/sdk/dist/splitly.iife.js apps/web/dist/sdk/v1.js
          cp packages/sdk/dist/splitly-qa.iife.js apps/web/dist/sdk/splitly-qa.iife.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
