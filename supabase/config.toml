# Supabase CLI settings. Anything not set here uses the CLI defaults.
project_id = "splitcraft"

# The SDK calls these from customer sites without a Supabase JWT; each endpoint checks
# the project's public key itself (and the events endpoint also checks the page's domain).
[functions.config]
verify_jwt = false

[functions.events]
verify_jwt = false

# Where Supabase Auth sends people after login, sign-up and password reset.
# Pushed with `npx supabase config push`; only the keys declared here change.
[auth]
site_url = "https://splitcraft-app.vercel.app"
additional_redirect_urls = ["https://splitcraft-app.vercel.app/**", "http://localhost:5173/**"]
